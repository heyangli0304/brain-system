events {
    worker_connections 1024;
}

http {
    upstream orchestrator_service {
        server orchestrator:8080;
    }

    server {
        listen 80;
        server_name localhost;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE';
        add_header Access-Control-Allow-Headers 'DNT,X-Mx-ReqToken,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Authorization';

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        location /api/orchestrator/ {
            proxy_pass http://orchestrator_service/api/v1/orchestrator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/actn/ {
            proxy_pass http://orchestrator_service/api/v1/actn/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/compute/ {
            proxy_pass http://orchestrator_service/api/v1/compute/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            proxy_pass http://orchestrator_service/health;
        }

        location /docs {
            proxy_pass http://orchestrator_service/docs;
        }

        location /openapi.json {
            proxy_pass http://orchestrator_service/openapi.json;
        }
    }
}
